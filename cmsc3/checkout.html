<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Draven - Checkout</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <button class="hamburger" aria-label="menu">☰</button>
    <h1>Draven</h1>
    <div class="header-right">
       <!-- iconz-->
    </div>
  </header>

  <main>
    <div class="order-summary">
      <span>ORDER SUMMARY</span>
      <span>▼</span>
      <div class="summary-line"></div>
      <span>PHP</span>
    </div>

    <form action="#">
      <div class="form-section">
        <h2>Contact</h2>
        <input type="email" placeholder="Email Address">
      </div>

      <div class="form-section">
        <h2>Shipping Address</h2>
        <div class="shipping-grid">
          <input type="text" placeholder="Country">
          <input type="text" placeholder="State">
          <input type="text" placeholder="First Name">
          <input type="text" placeholder="ZIP Code">
          <input type="text" placeholder="Last Name">
          <input type="text" placeholder="Phone Number">
          <div class="full-width">
             <input type="text" placeholder="City">
          </div>
        </div>
      </div>

      <div class="form-section">
        <h2>Mode of Payment</h2>
        <div class="payment-options">
          <button type="button" class="payment-btn active">
            <div class="radio-icon"></div> CARD
          </button>
          <button type="button" class="payment-btn">
            <div class="radio-icon"></div> GCASH
          </button>
          <button type="button" class="payment-btn">
            <div class="radio-icon"></div> CASH ON DELIVERY
          </button>
        </div>
      </div>

      <div class="action-section">
        <button type="submit" class="continue-btn">CONTINUE TO SHIPPING</button>
        <a href="product.html" class="return-link">‹ Return to Cart</a>
      </div>
    </form>
  </main>

  <footer>
    <a href="#">Refund Policy</a>
    <a href="#">Shipping</a>
    <a href="#">Terms of Service</a>
    <a href="#">Privacy Policy</a>
    <a href="#">Contact</a>
  </footer>

</body>
</html>
