<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout — Draven</title>
  <meta name="description" content="Check out: contact, shipping address and payment.">
  <meta name="theme-color" content="#361319">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cormorant+Garamond:wght@500;600&family=UnifrakturMaguntia&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/checkout.css">
</head>

<body class="page-checkout">

  <a class="skip-link" href="#main">Skip to main content</a>


  <!-- ======================= HEADER ======================= -->
  <header class="site-header">
    <div class="site-header__inner">

      <details class="menu">
        <summary class="menu__button" aria-label="Menu">
          <span class="menu__bars" aria-hidden="true"><i></i><i></i><i></i></span>
        </summary>
        <nav class="menu__panel" aria-label="Main">
          <a href="home.html">Home</a>
          <a href="product.html">Product</a>
          <a href="checkout.html" aria-current="page">Checkout</a>
        </nav>
      </details>

      <a class="logo" href="home.html" aria-label="Draven, home">Draven</a>

      <div class="site-header__actions">
        <form class="search" role="search" action="#" onsubmit="return false">
          <label class="search__icon" for="site-search">
            <span class="visually-hidden">Search</span>
            <svg viewBox="0 0 24 30" fill="none" stroke="currentColor" aria-hidden="true" focusable="false">
              <circle cx="9.5" cy="9.5" r="7" stroke-width="3.2" />
              <path d="M14.8 15.3 22.2 26" stroke-width="3.6" stroke-linecap="round" />
            </svg>
          </label>
          <input class="search__input" id="site-search" type="search" name="q" placeholder="Search" autocomplete="off" spellcheck="false">
        </form>

        <a class="cart-link" href="checkout.html" aria-label="Cart">
          <svg viewBox="0 0 43.68 36.65" aria-hidden="true" focusable="false">
            <path d="M41.6921 2 39.1976 24.7626a2.5 2.5 0 0 1-2.4881 2.7821H19.0095a2.5 2.5 0 0 1-2.4289-1.8716L11.1624 3.4715A2.5 2.5 0 0 0 9.2335 2H0" fill="none" stroke="currentColor" stroke-width="4" />
            <ellipse cx="20.1736" cy="33.7637" rx="2.69" ry="2.89" fill="currentColor" />
            <ellipse cx="36.3125" cy="33.7637" rx="2.69" ry="2.89" fill="currentColor" />
          </svg>
        </a>
      </div>

    </div>
  </header>


  <main id="main" class="container checkout">
    <h1 class="visually-hidden">Checkout</h1>

    <img class="bats checkout__bats" src="assets/bats-small.svg" alt="" width="236" height="20" aria-hidden="true">

    <div class="panel checkout-panel">

      <!-- ======================= ORDER SUMMARY ======================= -->
      <details class="summary">
        <summary class="summary__bar">
          <span class="summary__title">Order summary</span>
          <span class="summary__chevron" aria-hidden="true"></span>
          <span class="ornament-rule summary__rule" aria-hidden="true"></span>
          <span class="summary__total">$0.00</span>
        </summary>

        <div class="summary__content">
          <ul class="summary__items">
            <li><span>Lorem ipsum &times; 1</span><span>$0.00</span></li>
            <li><span>Lorem ipsum &times; 1</span><span>$0.00</span></li>
          </ul>
          <dl class="summary__totals">
            <div><dt>Subtotal</dt><dd>$0.00</dd></div>
            <div><dt>Shipping</dt><dd>$0.00</dd></div>
            <div class="summary__totals-final"><dt>Total</dt><dd>$0.00</dd></div>
          </dl>
        </div>
      </details>


      <!-- ======================= FORM ======================= -->
      <form class="checkout-form" action="#" method="post" onsubmit="return false" novalidate>

        <!-- Contact -->
        <fieldset class="form-section">
          <legend class="form-section__title">Contact</legend>
          <div class="form-grid">
            <div class="field">
              <input class="field__input" type="email" id="email" name="email" autocomplete="email" placeholder=" ">
              <label class="field__label" for="email">Email Address</label>
            </div>
          </div>
        </fieldset>

        <!-- Shipping address -->
        <fieldset class="form-section">
          <legend class="form-section__title">Shipping address</legend>
          <div class="form-grid form-grid--columns">
            <div class="field">
              <input class="field__input" type="text" id="country" name="country" autocomplete="country-name" placeholder=" ">
              <label class="field__label" for="country">Country</label>
            </div>
            <div class="field">
              <input class="field__input" type="text" id="first-name" name="first-name" autocomplete="given-name" placeholder=" ">
              <label class="field__label" for="first-name">First Name</label>
            </div>
            <div class="field">
              <input class="field__input" type="text" id="last-name" name="last-name" autocomplete="family-name" placeholder=" ">
              <label class="field__label" for="last-name">Last Name</label>
            </div>
            <div class="field">
              <input class="field__input" type="text" id="city" name="city" autocomplete="address-level2" placeholder=" ">
              <label class="field__label" for="city">City</label>
            </div>
            <div class="field">
              <input class="field__input" type="text" id="state" name="state" autocomplete="address-level1" placeholder=" ">
              <label class="field__label" for="state">State</label>
            </div>
            <div class="field">
              <input class="field__input" type="text" id="zip" name="zip" autocomplete="postal-code" placeholder=" ">
              <label class="field__label" for="zip">ZIP Code</label>
            </div>
            <div class="field">
              <input class="field__input" type="tel" id="phone" name="phone" autocomplete="tel" placeholder=" ">
              <label class="field__label" for="phone">Phone Number</label>
            </div>
          </div>
        </fieldset>

        <!-- Mode of payment -->
        <fieldset class="form-section">
          <legend class="form-section__title">Mode of payment</legend>
          <div class="choice-row">
            <label class="choice">
              <input class="choice__input" type="radio" name="payment" value="card" checked>
              <span class="choice__box"><span class="choice__ring" aria-hidden="true"></span>Card</span>
            </label>
            <label class="choice">
              <input class="choice__input" type="radio" name="payment" value="gcash">
              <span class="choice__box"><span class="choice__ring" aria-hidden="true"></span>GCash</span>
            </label>
            <label class="choice">
              <input class="choice__input" type="radio" name="payment" value="cod">
              <span class="choice__box"><span class="choice__ring" aria-hidden="true"></span>Cash on delivery</span>
            </label>
          </div>
        </fieldset>

        <!-- Continue and return -->
        <div class="checkout-actions">
          <button class="btn btn--primary checkout-actions__continue" type="submit">Continue to shipping</button>
          <a class="back-link" href="product.html">Return to cart</a>
        </div>

      </form>

    </div>
  </main>


  <!-- ======================= FOOTER ======================= -->
  <footer class="site-footer site-footer--legal-only">
    <nav class="footer-links" aria-label="Store policies">
      <a href="#">Refund Policy</a>
      <a href="#">Shipping</a>
      <a href="#">Terms of Service</a>
      <a href="#">Privacy Policy</a>
      <a href="#">Contact</a>
    </nav>

    <img class="cobweb cobweb--left" src="assets/cobweb.svg" alt="" width="85" height="85" aria-hidden="true">
    <img class="cobweb cobweb--right" src="assets/cobweb.svg" alt="" width="85" height="85" aria-hidden="true">
  </footer>

</body>

</html>
